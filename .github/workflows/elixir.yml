name: Elixir CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  minimum-consumer:
    name: Minimum production consumer
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: integration/minimum_consumer

    env:
      MIX_ENV: prod

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.18.4"
          otp-version: "28.0"

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Audit dependency advisories
        run: mix hex.audit

      - name: Compile consumer (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Exercise RFC 9728 metadata
        run: mix run smoke.exs

  build:
    name: Build & Test (Elixir ${{ matrix.elixir }} / OTP ${{ matrix.otp }})
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        include:
          - elixir: "1.18.4"
            otp: "28.0"
          - elixir: "1.19.4"
            otp: "28.3"
            lint: true

    env:
      MIX_ENV: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v7.0.1

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: ${{ matrix.elixir }}
          otp-version: ${{ matrix.otp }}

      - name: Restore dependencies cache
        uses: actions/cache@v6.1.0
        with:
          path: deps
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-${{ hashFiles('**/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-mix-

      - name: Restore build cache
        uses: actions/cache@v6.1.0
        with:
          path: _build
          key: ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-${{ hashFiles('**/mix.lock') }}-${{ hashFiles('**/mix.exs') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.otp }}-${{ matrix.elixir }}-build-

      - name: Install dependencies
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Install Phoenix installer archive
        run: mix archive.install hex phx_new 1.8.13 --force

      - name: Audit dependency advisories
        if: ${{ matrix.lint }}
        run: mix hex.audit

      - name: Compile (warnings as errors)
        run: mix compile --warnings-as-errors

      - name: Run tests
        run: mix test --trace

      - name: Check formatting
        if: ${{ matrix.lint }}
        run: mix format --check-formatted

      - name: Run Credo
        if: ${{ matrix.lint }}
        run: mix credo --strict

      - name: Build docs
        if: ${{ matrix.lint }}
        env:
          MIX_ENV: dev
        run: mix docs

  attesto-2-path:
    name: Attesto 2 path compatibility
    runs-on: ubuntu-latest

    env:
      MIX_ENV: test
      ATTESTO_PATH: "1"

    steps:
      - name: Checkout AttestoMCP
        uses: actions/checkout@v7.0.1
        with:
          path: attesto_mcp

      - name: Checkout Attesto 2 source
        uses: actions/checkout@v7.0.1
        with:
          repository: XukuLLC/attesto
          ref: 9b6199f9f64a350a40e3b230ffbd1ba5fc5eb277
          path: attesto

      - name: Set up Elixir
        uses: erlef/setup-beam@v1.24.1
        with:
          elixir-version: "1.19.4"
          otp-version: "28.3"

      - name: Install path dependencies
        working-directory: attesto_mcp
        run: |
          mix local.hex --force
          mix local.rebar --force
          mix deps.get

      - name: Compile against Attesto 2 source
        working-directory: attesto_mcp
        run: mix compile --warnings-as-errors

      - name: Assert Attesto 2 path dependency
        working-directory: attesto_mcp
        run: >-
          mix run --no-compile -e 'version = Application.spec(:attesto, :vsn) |> to_string();
          unless Version.match?(version, ">= 2.0.0 and < 3.0.0"), do: System.halt(1)'

      - name: Run tests against Attesto 2 source
        working-directory: attesto_mcp
        run: mix test --trace
